    // --- 計算ユーティリティ ---
    function calculateBMR(gender, weight, height, age) {
      const w = parseFloat(weight) || 0;
      const h = parseFloat(height) || 0;
      const a = parseFloat(age) || 0;
      if (w <= 0 || h <= 0 || a <= 0) return 1500;
      if (gender === 'female') {
        return Math.round(655.1 + (9.563 * w) + (1.850 * h) - (4.676 * a));
      } else {
        return Math.round(66.47 + (13.75 * w) + (5.003 * h) - (6.75 * a));
      }
    }

    function calculateTargetCalories(bmr, activityLevel) {
      let factor = 1.3;
      if (parseInt(activityLevel) === 2) factor = 1.5;
      if (parseInt(activityLevel) === 3) factor = 1.7;
      const tdee = bmr * factor;
      return Math.max(bmr, Math.round(tdee - 300));
    }

    function calculateIdealPFC(targetCalories) {
      const tc = targetCalories || 2000;
      return {
        protein: Math.round((tc * 0.18) / 4),
        fat: Math.round((tc * 0.22) / 9),
        carbs: Math.round((tc * 0.60) / 4)
      };
    }

    function getLevelFromExp(exp) {
      if (exp >= EXP_THRESHOLDS[5]) return 5;
      if (exp >= EXP_THRESHOLDS[4]) return 4;
      if (exp >= EXP_THRESHOLDS[3]) return 3;
      if (exp >= EXP_THRESHOLDS[2]) return 2;
      return 1;
    }

    function getNextExpTarget(level) {
      if (level >= 5) return EXP_THRESHOLDS[5];
      return EXP_THRESHOLDS[level + 1];
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

        const today = getTodayString();
        const lastLogin = appData.user_profile?.last_login_date;
        if (lastLogin && lastLogin !== today) {
          // 前日分の目標達成を判定
          const yesterdayMeals = appData.meal_history.filter(m => m.date === lastLogin);
          const yesterdayCals = yesterdayMeals.reduce((sum, m) => sum + (parseFloat(m.calories) || 0), 0);
          const bmr = appData.user_profile.bmr;
          const target = appData.user_profile.target_calories;
          
          let bonusAdded = 0;
          let newProgress = { ...appData.buddy_progress };
          const curBuddy = appData.user_profile.selected_buddy || "riko";

          if (yesterdayMeals.length > 0 && yesterdayCals >= bmr && yesterdayCals <= target) {
            bonusAdded = 30;
            const curExp = (newProgress[curBuddy]?.exp || 0) + bonusAdded;
            newProgress[curBuddy] = {
              exp: curExp,
              level: getLevelFromExp(curExp)

          setBuddySpeech(initialQuote);
        }
      }, [currentBuddyKey, currentBuddyLevel]);

      // 今日の食事履歴
      const todayStr = getTodayString();
      const todayMeals = useMemo(() => {
        return (appData.meal_history || []).filter(item => {
          return item.date === todayStr;
        });
      }, [appData.meal_history, todayStr]);

      // 今日の合計栄養素
      const todayTotals = useMemo(() => {
        return todayMeals.reduce((acc, item) => {
          acc.calories += parseFloat(item.calories) || 0;
          acc.protein += parseFloat(item.protein) || 0;
          acc.fat += parseFloat(item.fat) || 0;
          acc.carbs += parseFloat(item.carbs) || 0;
          return acc;
        }, { calories: 0, protein: 0, fat: 0, carbs: 0 });
      }, [todayMeals]);

      const idealPFC = useMemo(() => {
        return calculateIdealPFC(appData.user_profile.target_calories);
      }, [appData.user_profile.target_calories]);

      // 今日の最新体重
      const latestWeight = useMemo(() => {
        if (!appData.weight_history || appData.weight_history.length === 0) {
          return appData.user_profile?.current_weight || 0;
        }
        return appData.weight_history[appData.weight_history.length - 1].weight;
      }, [appData.weight_history, appData.user_profile]);

      // バディタップ時の発話
      const handleBuddyTap = () => {
        const quotes = currentBuddy.quotes[currentBuddyLevel] || currentBuddy.quotes[1];
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        setBuddySpeech(randomQuote);
        setCurrentEmotion(prev => (prev === "smile" ? "shy" : "smile"));
        setTimeout(() => setCurrentEmotion("neutral"), 3000);
      };

      // 体重クイック保存
      const handleSaveQuickWeight = (e) => {
        e.preventDefault();
        const val = parseFloat(quickWeightInput);
        if (isNaN(val) || val <= 20 || val >= 250) {
          alert("有効な体重(20kg〜250kg)を入力してください。");
          return;
        }
        const today = getTodayString();
        const existingIdx = (appData.weight_history || []).findIndex(w => w.date === today);
        let updatedWeights = [...(appData.weight_history || [])];

        if (existingIdx >= 0) {
          updatedWeights[existingIdx] = { date: today, weight: val, timestamp: Date.now() };
        } else {
          updatedWeights.push({ date: today, weight: val, timestamp: Date.now() });
          updatedWeights.sort((a, b) => new Date(a.date) - new Date(b.date));
        }

        const updated = {
          ...appData,
          user_profile: {
            ...appData.user_profile,
            current_weight: val
          },
          weight_history: updatedWeights
        };
        saveState(updated);
        setQuickWeightInput("");
        showToast(`本日の体重 ${val}kg を記録しました！`);
      };

      // EXP加算 & レベルアップ処理
      const addExpToCurrentBuddy = (addedExp = 10) => {
        const cur = appData.buddy_progress?.[currentBuddyKey] || { exp: 0, level: 1 };
        const newExp = cur.exp + addedExp;
        const newLevel = getLevelFromExp(newExp);
        const didLevelUp = newLevel > cur.level;

        const updatedProgress = {
          ...appData.buddy_progress,
          [currentBuddyKey]: {
            exp: newExp,
            level: newLevel
          }
        };

        const updated = {
          ...appData,
          buddy_progress: updatedProgress
        };
        saveState(updated);

        if (didLevelUp) {
          setCurrentEmotion("smile");
          setBuddySpeech(`レベルアップ！Lv.${newLevel}になったよ！これからもよろしくね！`);
          showToast(`親愛度アップ！ Lv.${newLevel} に到達しました！🎉`);
        } else {
          showToast(`+${addedExp} EXP 獲得！`);
        }
      };

      // 食事履歴の削除
      const handleDeleteMeal = (mealId) => {
        if (!confirm("この食事記録を削除しますか？")) return;
        const filtered = appData.meal_history.filter(m => m.id !== mealId);
        saveState({
          ...appData,
          meal_history: filtered
        });
        showToast("食事記録を削除しました");
      };

      // 画像選択 & Canvasリサイズ処理
      const handleImageSelect = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 800;
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxDim) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else if (height > maxDim) {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const dataUrl = canvas.toDataURL('image/webp', 0.75);
            const base64Clean = dataUrl.replace(/^data:image\/\w+;base64,/, '');

            setImagePreview(dataUrl);
            setImageBase64(base64Clean);
            // 解析開始
            executeGeminiAnalysis(base64Clean);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      };

      // Gemini REST API による画像解析
      const executeGeminiAnalysis = async (cleanBase64) => {
        if (!appData.api_key) {
          alert("Gemini APIキーが設定されていません。設定画面で登録してください。");
          return;
        }

        setIsAnalyzing(true);
        const apiKey = appData.api_key.trim();
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

        const promptText = `
あなたはユーザー専属のダイエットバディ「${currentBuddy.name}」です。
以下のキャラクター性格・口調設定を厳格に順守してください。
${currentBuddy.systemPrompt}

現在のユーザー状態:
- 1日目標カロリー: ${appData.user_profile.target_calories} kcal
- 本日の現在摂取カロリー: ${todayTotals.calories} kcal
- バディ親愛レベル: Lv.${currentBuddyLevel}

[Task]
送信された画像を解析してください。
1. 画像が食べ物・飲み物であるかを厳格に判定してください。
2. 食べ物でない場合は "is_food": false とし、バディとしてのツッコミ・再撮影要請を出力してください。
3. 食べ物の場合は、標準的な1人前としてカロリーおよび栄養素を推定し、バディのリアクションを出力してください。レベルが高いほど打ち解けた親密なメッセージにしてください。

[Output JSON Schema Only]
{
  "is_food": true,
  "menu_items": ["料理名1", "料理名2"],
  "total_nutrition": {
    "calories": 650,
    "protein": 22.5,
    "fat": 18.0,
    "carbs": 80.0,
    "salt_equivalent": 2.1,
    "fiber": 3.0
  },
  "flags": {
    "excess": ["fat"],
    "deficit": ["fiber"]
  },
  "buddy_reaction": {
    "emotion": "smile",
    "dialogue": "バディ口調のメッセージ（100字前後）。次回のおすすめ食材と控えるべき食材を明記。"
  }
}
`;

        const requestBody = {
          contents: [{
            role: "user",
            parts: [
              { text: promptText },
              {
                inline_data: {
                  mime_type: "image/webp",
                  data: cleanBase64
                }
              }
            ]
          }],
          generationConfig: {
            response_mime_type: "application/json"
          }
        };

        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody)
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error?.message || `API通信エラー Status: ${res.status}`);
          }

          const resData = await res.json();
          const rawText = resData.candidates?.[0]?.content?.parts?.[0]?.text;
          if (!rawText) throw new Error("APIから応答テキストが得られませんでした。");

          // マークダウンコードブロック除去
          const cleanText = rawText.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();
          const parsed = JSON.parse(cleanText);

          setAnalysisResultRaw(parsed);

          if (!parsed.is_food) {
            setBuddySpeech(parsed.buddy_reaction?.dialogue || "これは食べ物じゃないみたいですよ…？もう一度撮ってみてくださいね！");
            setCurrentEmotion("worry");
            showToast("食べ物が検出されませんでした。");
          } else {
            // フォームへ自動入力
            const items = parsed.menu_items && parsed.menu_items.length > 0 ? parsed.menu_items.join("、") : "食事";
            const nut = parsed.total_nutrition || {};
            setMealForm({
              name: items,
              calories: String(Math.round(nut.calories || 0)),
              protein: String(nut.protein || 0),
              fat: String(nut.fat || 0),
              carbs: String(nut.carbs || 0),
              salt_equivalent: String(nut.salt_equivalent || 0),
              fiber: String(nut.fiber || 0)
            });

            if (parsed.buddy_reaction) {
              setBuddySpeech(parsed.buddy_reaction.dialogue);
              if (parsed.buddy_reaction.emotion) {
                setCurrentEmotion(parsed.buddy_reaction.emotion);
              }
            }
          }
        } catch (err) {
          console.error("Gemini parse failed:", err);
          showToast(`解析エラー: ${err.message}`);
          setBuddySpeech("ごめんなさい、写真の解析に失敗しちゃいました。直接数値を教えてくれると助かります！");
          setCurrentEmotion("worry");
        } finally {
          setIsAnalyzing(false);
        }
      };

      // 食事記録の保存確定
      const handleConfirmMeal = (e) => {
        e.preventDefault();
        const calNum = parseFloat(mealForm.calories);
        if (isNaN(calNum) || calNum < 0) {
          alert("カロリーに有効な数値を入力してください。");
          return;
        }

        const newMeal = {
          id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : "meal_" + Date.now(),
          date: getTodayString(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          name: mealForm.name.trim() || "食事",
          calories: calNum,
          protein: parseFloat(mealForm.protein) || 0,
          fat: parseFloat(mealForm.fat) || 0,
          carbs: parseFloat(mealForm.carbs) || 0,
          salt_equivalent: parseFloat(mealForm.salt_equivalent) || 0,
          fiber: parseFloat(mealForm.fiber) || 0,
          image: imagePreview || null
        };

        const updatedMeals = [newMeal, ...(appData.meal_history || [])];
        saveState({
          ...appData,
          meal_history: updatedMeals
        });

        // バディにEXP付与
        addExpToCurrentBuddy(10);

        // 閉じる & 初期化
        setShowMealModal(false);
        setImagePreview(null);
        setImageBase64("");
        setAnalysisResultRaw(null);
        setMealForm({ name: "", calories: "", protein: "", fat: "", carbs: "", salt_equivalent: "", fiber: "" });
      };

      // 計算値: カロリー進捗
      const remainingCalories = appData.user_profile.target_calories - todayTotals.calories;
      const caloriePercent = Math.min(100, Math.round((todayTotals.calories / (appData.user_profile.target_calories || 1)) * 100));

      return (
        <div className="flex flex-col min-h-screen">
          {/* トースト表示 */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-slate-900/90 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-lg transition-all">
              {toastMessage}
            </div>
          )}

          {/* ヘッダーエリア */}
          <header className="px-4 py-3 bg-white border-b border-slate-100 flex items-center justify-between sticky top-0 z-20">
            <div>
              <div className="text-[11px] font-bold text-slate-400 tracking-wider">
                {new Date().toLocaleDateString('ja-JP', { month: 'short', day: 'numeric', weekday: 'short' })}
              </div>
              <div className="text-base font-extrabold text-slate-800 flex items-center gap-1.5">
                <span>{appData.user_profile?.nickname || "ゲスト"}</span>
                <span className="text-xs font-normal text-slate-400">さん</span>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setShowReportModal(true)}
                className="px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold flex items-center gap-1 transition"
                title="分析レポート・バディ一覧"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span>分析</span>
              </button>
              <button
                onClick={() => setShowSettingsModal(true)}
                className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition"
                title="設定"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </button>
            </div>
          </header>

          {/* バディステータス & 親愛度バー */}
          <div className="px-4 py-2 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <span className="text-lg">{currentBuddy.emoji}</span>
              <div>
                <div className="flex items-center gap-1.5">
                  <span className="text-xs font-bold text-slate-800">{currentBuddy.name}</span>
                  <span
                    className="text-[10px] font-bold px-1.5 py-0.5 rounded text-white"
                    style={{ backgroundColor: currentBuddy.themeColor }}
                  >
                    Lv.{currentBuddyLevel}
                  </span>
                </div>
                <div className="text-[10px] text-slate-400">{currentBuddy.role}</div>
              </div>
            </div>

            {/* EXPバー */}
            <div className="w-32">
              <div className="flex justify-between text-[10px] text-slate-500 mb-0.5 font-medium">
                <span>親愛度</span>
                <span>{currentBuddyExp} / {getNextExpTarget(currentBuddyLevel)} EXP</span>
              </div>
              <div className="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
                <div
                  className="h-full rounded-full transition-all duration-500"
                  style={{
                    backgroundColor: currentBuddy.themeColor,
                    width: `${Math.min(100, Math.round((currentBuddyExp / getNextExpTarget(currentBuddyLevel)) * 100))}%`
                  }}
                />
              </div>
            </div>
          </div>

          {/* バディ表示 & 吹き出し (タップインタラクション) */}
          <div
            onClick={handleBuddyTap}
            className="px-4 pt-4 pb-3 flex flex-col items-center cursor-pointer select-none bg-gradient-to-b from-white to-slate-50 relative group transition active:scale-[0.99]"
          >
            {/* 吹き出し */}
            <div className="relative mb-3 w-full max-w-xs bg-white rounded-2xl p-3 border border-slate-200 shadow-sm text-center">
              <div className="text-xs text-slate-700 font-medium leading-relaxed">
                {buddySpeech || "今日も一緒にがんばりましょう！"}
              </div>
              {/* 吹き出しの三角ヒゲ */}
              <div className="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-0 h-0 border-l-[6px] border-l-transparent border-r-[6px] border-r-transparent border-t-[8px] border-t-white"></div>
            </div>

            {/* キャラクター描画 */}
            <div className="relative">
              <BuddyAvatar
                buddy={currentBuddy}
                emotion={currentEmotion}
                level={currentBuddyLevel}
                size={140}
              />
              <div className="absolute -bottom-1 right-0 text-[10px] bg-slate-800/70 text-white px-2 py-0.5 rounded-full opacity-70 group-hover:opacity-100">
                タップして会話 💬
              </div>
            </div>
          </div>

          {/* 今日の体重クイック入力エリア */}
          <div className="px-4 py-2.5 bg-slate-100/70 border-y border-slate-200/60">
            <form onSubmit={handleSaveQuickWeight} className="flex items-center justify-between gap-3 text-xs">
              <div className="flex items-center gap-1.5 font-bold text-slate-700 whitespace-nowrap">
                <span>⚖️ 本日の体重:</span>
                <span className="text-slate-900 font-extrabold text-sm">{latestWeight > 0 ? `${latestWeight} kg` : "未記録"}</span>
              </div>
              <div className="flex items-center gap-1.5 flex-1 max-w-[170px]">
                <input
                  type="number"
                  step="0.1"
                  placeholder={latestWeight > 0 ? String(latestWeight) : "例: 65.2"}
                  value={quickWeightInput}
                  onChange={(e) => setQuickWeightInput(e.target.value)}
                  className="w-full bg-white border border-slate-300 rounded px-2 py-1 text-slate-800 text-xs focus:ring-1 focus:ring-blue-500 outline-none"
                />
                <button
                  type="submit"
                  className="bg-slate-800 hover:bg-slate-900 text-white font-bold px-3 py-1 rounded text-xs transition whitespace-nowrap"
                >
                  記録
                </button>
              </div>
            </form>
          </div>

          {/* ダッシュボード中央: カロリーメーター & PFC */}
          <div className="px-4 py-4 space-y-4">
            {/* カロリー進捗カード */}
            <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
              <div>
                <div className="text-xs font-semibold text-slate-400">1日の目標摂取カロリー</div>
                <div className="text-2xl font-black text-slate-800 mt-0.5">
                  {todayTotals.calories}
                  <span className="text-xs font-bold text-slate-400 ml-1">/ {appData.user_profile.target_calories} kcal</span>
                </div>
                <div className="mt-1 text-xs font-bold">
                  {remainingCalories >= 0 ? (
                    <span className="text-emerald-600">あと {remainingCalories} kcal 食べられます</span>
                  ) : (
                    <span className="text-rose-500">⚠️ {Math.abs(remainingCalories)} kcal オーバーです</span>
                  )}
                </div>
                <div className="text-[10px] text-slate-400 mt-1">
                  基礎代謝(BMR): {appData.user_profile.bmr} kcal
                </div>
              </div>

              {/* 円形プログレスメーター */}
              <div className="relative w-20 h-20 flex items-center justify-center">
                <svg className="w-20 h-20 transform -rotate-90" viewBox="0 0 36 36">
                  <path
                    className="text-slate-100"
                    strokeWidth="3.5"
                    stroke="currentColor"
                    fill="none"
                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                  />
                  <path
                    className={`${remainingCalories < 0 ? 'text-rose-500' : 'text-blue-500'} transition-all duration-500`}
                    strokeDasharray={`${caloriePercent}, 100`}
                    strokeWidth="3.5"
                    strokeLinecap="round"
                    stroke="currentColor"
                    fill="none"
                    d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                  />
                </svg>
                <div className="absolute text-center">
                  <span className="text-xs font-black text-slate-800">{caloriePercent}%</span>
                </div>
              </div>
            </div>

            {/* PFCバランスバー */}
            <div className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm">
              <div className="text-xs font-bold text-slate-700 mb-3 flex items-center justify-between">
                <span>PFCバランス達成度</span>
                <span className="text-[10px] font-normal text-slate-400">厚労省基準比率</span>
              </div>

              <div className="space-y-2.5">
                {/* タンパク質 (P) */}
                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="font-bold text-slate-700">P たんぱく質</span>
                    <span className="text-slate-500 text-[11px] font-medium">
                      {Math.round(todayTotals.protein)}g / 目標 {idealPFC.protein}g
                    </span>
                  </div>
                  <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div
                      className="bg-emerald-500 h-full rounded-full transition-all duration-300"
                      style={{ width: `${Math.min(100, Math.round((todayTotals.protein / (idealPFC.protein || 1)) * 100))}%` }}
                    />
                  </div>
                </div>

                {/* 脂質 (F) */}
                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="font-bold text-slate-700">F 脂質</span>
                    <span className="text-slate-500 text-[11px] font-medium">
                      {Math.round(todayTotals.fat)}g / 目標 {idealPFC.fat}g
                    </span>
                  </div>
                  <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                    <div
                      className="bg-amber-500 h-full rounded-full transition-all duration-300"
                      style={{ width: `${Math.min(100, Math.round((todayTotals.fat / (idealPFC.fat || 1)) * 100))}%` }}
                    />
                  </div>
                </div>

                {/* 炭水化物 (C) */}
                <div>
                  <div className="flex justify-between text-xs mb-1">
                    <span className="font-bold text-slate-700">C 炭水化物</span>
                    <span className="text-slate-500 text-[11px] font-medium">
                      {Math.round(todayTotals.carbs)}g / 目標 {idealPFC.carbs}g
                    </span>

      const [nickname, setNickname] = useState(initialProfile?.nickname || "");
      const [gender, setGender] = useState(initialProfile?.gender || "male");

      const [currentWeight, setCurrentWeight] = useState(initialProfile?.current_weight || 65.0);
      const [targetWeight, setTargetWeight] = useState(initialProfile?.target_weight || 60.0);
      const [activityLevel, setActivityLevel] = useState(initialProfile?.activity_level || 2);
      const [selectedBuddy, setSelectedBuddy] = useState(initialProfile?.selected_buddy || "riko");

      // リアルタイム計算プレビュー
      const previewBMR = calculateBMR(gender, currentWeight, height, age);
      const previewTargetCalories = calculateTargetCalories(previewBMR, activityLevel);
      const previewPFC = calculateIdealPFC(previewTargetCalories);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!apiKey.trim()) {
          alert("Gemini APIキーを入力してください。");
          return;
        }
        if (!nickname.trim()) {
          alert("ニックネームを入力してください。");
          return;
        }

        const bmr = calculateBMR(gender, currentWeight, height, age);
        const targetCalories = calculateTargetCalories(bmr, activityLevel);

        const updatedProfile = {
          ...initialProfile,
          nickname: nickname.trim(),
          gender,
          age: parseInt(age) || 30,
          height: parseFloat(height) || 170.0,
          current_weight: parseFloat(currentWeight) || 65.0,
          target_weight: parseFloat(targetWeight) || 60.0,
          activity_level: parseInt(activityLevel) || 2,
          bmr,
          target_calories: targetCalories,
          selected_buddy: selectedBuddy
        };

        onSave(updatedProfile, apiKey.trim());
      };

              🔑 Gemini API キー *必須

              type="password"

                value={gender}
                onChange={(e) => setGender(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 outline-none"
              >
                <option value="male">男性</option>
                <option value="female">女性</option>
              </select>
            </div>
            <div>
              <label className="block font-bold text-slate-700 mb-1">年齢</label>
              <input
                type="number"

                max="120"
                value={age}
                onChange={(e) => setAge(e.target.value)}
                className="w-full bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-800 outline-none"

              <label className="block font-bold text-slate-700 mb-1">身長 (cm)</label>

                step="0.1"

            </div>
            <div className="mt-1 text-[10px] text-slate-500">
              PFC目安: P {previewPFC.protein}g / F {previewPFC.fat}g / C {previewPFC.carbs}g
            </div>
          </div>

          {/* 初期バディ選択 */}
          <div>
            <label className="block font-bold text-slate-700 mb-2">専属バディを選択</label>
            <div className="grid grid-cols-2 gap-2">
              {Object.values(BUDDY_DEFINITIONS).map((buddy) => (
                <div
                  key={buddy.id}
                  onClick={() => setSelectedBuddy(buddy.id)}
                  className={`p-2 rounded-xl border-2 cursor-pointer flex items-center gap-2 transition ${
                    selectedBuddy === buddy.id
                      ? 'border-blue-600 bg-blue-50/50'
                      : 'border-slate-200 bg-white hover:border-slate-300'
                  }`}
                >
                  <span className="text-xl">{buddy.emoji}</span>
                  <div className="overflow-hidden">
                    <div className="font-bold text-slate-800 text-xs truncate">{buddy.name}</div>
                    <div className="text-[10px] text-slate-400 truncate">{buddy.role}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <button
            type="submit"
            className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-md"
          >
            設定を保存してはじめる
          </button>
        </form>
      );
    }

    // --- 分析レポート & バディ交代モーダルコンポーネント (Chart.js統合) ---
    function ReportModal({ appData, onClose, onSwitchBuddy }) {
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);

      const weightHistory = useMemo(() => {
        return (appData.weight_history || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [appData.weight_history]);

      // Chart.js の React 統合 & クリーンアップ
      useEffect(() => {
        if (!chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');

        // データ0件でも破綻しない防御
        const labels = weightHistory.length > 0
          ? weightHistory.map(w => w.date.replace(/^\d{4}-/, ''))
          : ['今日'];
        const dataValues = weightHistory.length > 0
          ? weightHistory.map(w => w.weight)
          : [appData.user_profile?.current_weight || 0];

        if (chartInstanceRef.current) {
          chartInstanceRef.current.destroy();
        }

        chartInstanceRef.current = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [{
              label: '体重 (kg)',
              data: dataValues,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37, 99, 235, 0.1)',
              borderWidth: 2,
              tension: 0.2,
              fill: true,
              pointRadius: 4,
              pointBackgroundColor: '#2563eb'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false }
            },
            scales: {
              y: {
                beginAtZero: false,
                ticks: {
                  font: { size: 10 }
                }
              },
              x: {
                ticks: {
                  font: { size: 10 }
                }
              }
            }
          }
        });

        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [weightHistory, appData.user_profile]);

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
          <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            {/* モーダルヘッダー */}
            <div className="p-4 border-b border-slate-100 flex items-center justify-between">
              <span className="text-sm font-bold text-slate-800">📊 分析レポート & バディ交代</span>
              <button
                onClick={onClose}
                className="p-1 rounded-full text-slate-400 hover:text-slate-600"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>

            <div className="p-4 overflow-y-auto space-y-5">
              {/* 体重推移グラフ */}
              <div>
                <div className="text-xs font-bold text-slate-700 mb-2 flex items-center justify-between">
                  <span>体重推移グラフ</span>
                  <span className="text-[10px] text-slate-400 font-semibold">{weightHistory.length} 回の記録</span>
                </div>
                <div className="w-full h-44 bg-slate-50 p-2 rounded-xl border border-slate-200 relative">
                  <canvas ref={chartRef}></canvas>
                </div>
                {weightHistory.length === 0 && (
                  <div className="text-center text-[10px] text-slate-400 mt-1">
                    ※体重履歴が0件のため、初期設定体重を表示しています。
                  </div>
                )}
              </div>

              {/* バディ切り替えグリッド */}
              <div>
                <div className="text-xs font-bold text-slate-700 mb-2">バディ交代（全6名）</div>
                <div className="space-y-2">
                  {Object.values(BUDDY_DEFINITIONS).map((buddy) => {
                    const prog = appData.buddy_progress?.[buddy.id] || { exp: 0, level: 1 };
                    const isSelected = appData.user_profile?.selected_buddy === buddy.id;

                    return (
                      <div
                        key={buddy.id}
                        className={`p-3 rounded-xl border transition flex items-center justify-between ${
                          isSelected
                            ? 'border-blue-600 bg-blue-50/40 shadow-sm'
                            : 'border-slate-200 bg-white hover:border-slate-300'
                        }`}
                      >
                        <div className="flex items-center gap-2.5">
                          <span className="text-2xl">{buddy.emoji}</span>
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className="text-xs font-bold text-slate-800">{buddy.name}</span>
                              <span
                                className="text-[9px] font-bold px-1.5 py-0.2 rounded text-white"
                                style={{ backgroundColor: buddy.themeColor }}
                              >
                                Lv.{prog.level}
                              </span>
                            </div>
                            <div className="text-[10px] text-slate-400">{buddy.role} • 累計 {prog.exp} EXP</div>
                          </div>
                        </div>

                        <div>
                          {isSelected ? (
                            <span className="text-[10px] font-bold text-blue-600 bg-blue-100 px-2 py-1 rounded-md">
                              同行中
                            </span>
                          ) : (
                            <button
                              onClick={() => onSwitchBuddy(buddy.id)}
                              className="text-[10px] font-bold bg-slate-800 hover:bg-slate-900 text-white px-3 py-1 rounded-md transition"
                            >
                              交代する
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- エントリーポイント & マウント ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
